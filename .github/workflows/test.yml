name: ✅ Automated Tests

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  test:
    name: Lint, unit, and E2E
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: portal_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d portal_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: ${{ secrets.SUPABASE_POSTGRES_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.SUPABASE_POSTGRES_DIRECT_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify migrations on a clean database
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/portal_migration_test?schema=public
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/portal_migration_test?schema=public
        run: |
          bunx prisma migrate deploy
          bunx prisma migrate diff \
            --from-schema-datasource prisma/schema.prisma \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium webkit

      - name: Lint test files
        run: bun run lint:tests

      - name: Unit tests
        run: bun run test:unit

      - name: E2E tests
        run: bun run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
